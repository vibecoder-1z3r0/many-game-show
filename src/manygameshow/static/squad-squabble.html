<!DOCTYPE html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Squad Squabble</title>
    <style>
      /* Self-hosted (not Google Fonts CDN) so the display font still loads
         on flaky/offline conference wifi — see UI_LOOK_AND_FEEL.md. */
      @font-face {
        font-family: "Orbitron";
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/orbitron-600.ttf") format("truetype");
      }

      @font-face {
        font-family: "Orbitron";
        font-weight: 800;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/orbitron-800.ttf") format("truetype");
      }

      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --panel-2: #1a2540;
        --text: #f5f7fa;
        --text-dim: #9aa5b8;
        --accent: #ffcc00;
        --border: #263252;
        --strike-red: #ff4d4d;
      }

      [data-theme="stage"] {
        --bg: #05060a;
        --panel: #12141c;
        --panel-2: #1b1f2b;
        --text: #f2f2f5;
        --text-dim: #8b8f9c;
        --accent: #00e5ff;
        --border: #2a2f3d;
      }

      [data-theme="bright"] {
        --bg: #fef6e4;
        --panel: #ffffff;
        --panel-2: #fff1d6;
        --text: #1b1b1b;
        --text-dim: #6b6b6b;
        --accent: #ff5a3c;
        --border: #f0d9b5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }

      .display-num {
        font-family: "Orbitron", system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }

      header h1 {
        font-size: 1rem;
        margin: 0;
        margin-right: auto;
      }

      .breadcrumb a {
        color: var(--text-dim);
        text-decoration: none;
      }

      .breadcrumb a:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .crumb-sep {
        color: var(--text-dim);
        margin: 0 0.3rem;
      }

      .tabs {
        display: flex;
        gap: 0.4rem;
      }

      .tabs button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.35rem 0.8rem;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .tabs button.active {
        background: var(--accent);
        color: #10131a;
        border-color: var(--accent);
        font-weight: 700;
      }

      select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.3rem 0.5rem;
        font-size: 0.8rem;
      }

      .conn-badge {
        font-size: 0.75rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-weight: 600;
      }

      .conn-badge.ok {
        background: #1e4d2b;
        color: #7cf29c;
      }

      .conn-badge.lost {
        background: #4d1e1e;
        color: #f29c7c;
      }

      .icon-btn {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.35rem 0.6rem;
        cursor: pointer;
        font-size: 0.85rem;
      }

      #mini-header {
        position: fixed;
        top: 0.6rem;
        right: 0.6rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.5rem 0.35rem 0.7rem;
        z-index: 100;
      }

      .mini-led {
        width: 0.8rem;
        height: 0.8rem;
        border-radius: 50%;
      }

      .mini-led.ok {
        background: #2ecc71;
        box-shadow: 0 0 8px 1px rgba(46, 204, 113, 0.7);
      }

      .mini-led.lost {
        background: #ff4d4d;
        box-shadow: 0 0 8px 1px rgba(255, 77, 77, 0.7);
      }

      main {
        padding: 1rem;
      }

      [hidden] {
        display: none !important;
      }

      /* ---------- Display view ---------- */

      #view-display {
        display: flex;
        flex-direction: column;
        gap: clamp(0.6rem, 1.5vw, 1rem);
      }

      #round-display {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(2rem, 5vw, 3.4rem);
        color: var(--accent);
        letter-spacing: 0.06em;
        font-weight: 800;
      }

      .question-flip-outer {
        perspective: 1400px;
        min-height: clamp(4rem, 10vw, 7rem);
      }

      #question-card {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: clamp(4rem, 10vw, 7rem);
        transform-style: preserve-3d;
        transition: transform 0.6s ease;
      }

      #question-card.flipped {
        transform: rotateY(180deg);
      }

      .question-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: clamp(0.75rem, 2vw, 1.5rem);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(1rem, 2.4vw, 1.7rem);
        font-weight: 600;
      }

      #question-front {
        color: var(--text-dim);
        visibility: visible;
      }

      #question-card.flipped #question-front {
        visibility: hidden;
      }

      #question-back {
        transform: rotateY(180deg);
        visibility: hidden;
      }

      #question-card.flipped #question-back {
        visibility: visible;
      }

      .board {
        display: grid;
        gap: clamp(0.4rem, 1vw, 0.75rem);
      }

      /* Each answer is a flip-card — vertical (rotateX), as opposed to the
         question card's horizontal (rotateY) flip — so revealing an answer
         reads as a distinct motion from revealing the question. */
      .board-flip-outer {
        perspective: 1200px;
        min-height: clamp(3.2rem, 8vw, 5rem);
      }

      .board-row {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: clamp(3.2rem, 8vw, 5rem);
        transform-style: preserve-3d;
        transition: transform 0.5s ease;
      }

      .board-row.flipped {
        transform: rotateX(180deg);
      }

      .board-face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: clamp(0.5rem, 1.5vw, 1rem) clamp(0.75rem, 2vw, 1.5rem);
        font-size: clamp(1rem, 2.6vw, 1.8rem);
      }

      .board-front .answer-text {
        color: var(--text-dim);
      }

      .board-back {
        transform: rotateX(180deg);
      }

      .board-row .answer-text {
        letter-spacing: 0.02em;
      }

      .board-row .points {
        font-family: "Orbitron", system-ui, sans-serif;
        color: var(--accent);
        font-weight: 700;
      }

      .scoreboard {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.75rem, 2.5vw, 1.5rem);
      }

      .round-score-row {
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 0.75rem;
        padding: clamp(0.6rem, 1.5vw, 1.2rem) clamp(1.2rem, 4vw, 2.5rem);
        width: fit-content;
        text-align: center;
      }

      .round-score-label {
        font-size: clamp(0.9rem, 2vw, 1.3rem);
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .round-score-value {
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1.8rem, 5vw, 3.2rem);
        font-weight: 800;
        color: var(--accent);
      }

      .mid-stats {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(0.6rem, 2vw, 1.2rem);
      }

      .multiplier-badge {
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1rem, 2.5vw, 1.6rem);
        color: var(--accent);
        font-weight: 700;
      }

      .strikes {
        display: flex;
        gap: 0.3rem;
      }

      .strike-x {
        width: clamp(1.5rem, 3.5vw, 2.4rem);
        height: clamp(1.5rem, 3.5vw, 2.4rem);
        border-radius: 50%;
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 800;
        color: var(--text-dim);
      }

      .strike-x.on {
        border-color: var(--strike-red);
        color: var(--strike-red);
        background: rgba(255, 77, 77, 0.15);
      }

      .team-scores-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        gap: clamp(0.5rem, 2vw, 1.5rem);
      }

      .team-card {
        background: var(--panel);
        border: 2px solid var(--border);
        border-radius: 0.75rem;
        padding: clamp(0.6rem, 1.5vw, 1.2rem);
        text-align: center;
      }

      .team-card.controlling {
        border-color: var(--accent);
      }

      .team-name {
        font-size: clamp(0.9rem, 2vw, 1.3rem);
        color: var(--text-dim);
      }

      .team-score {
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1.8rem, 5vw, 3.2rem);
        font-weight: 800;
      }

      /* Strike overlay: big red Xs that shrink from center-screen to their
         real indicator's position (a FLIP-technique animation). */
      .strike-overlay {
        position: fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        pointer-events: none;
        z-index: 999;
      }

      .strike-overlay-x {
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(13.5rem, 33vw, 24rem);
        line-height: 1;
        color: var(--strike-red);
        text-shadow: 0 0 40px rgba(255, 77, 77, 0.85);
      }

      /* ---------- Control view ---------- */

      #view-control {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 640px;
      }

      fieldset {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.75rem;
      }

      legend {
        color: var(--text-dim);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0 0.3rem;
      }

      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.5rem;
      }

      .row:last-child {
        margin-bottom: 0;
      }

      input[type="text"],
      input[type="number"] {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.4rem 0.6rem;
        font-size: 0.9rem;
        flex: 1;
        min-width: 90px;
      }

      button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.45rem 0.8rem;
        font-size: 0.85rem;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button.primary {
        background: var(--accent);
        color: #10131a;
        font-weight: 700;
        border-color: var(--accent);
      }

      button.danger {
        border-color: var(--strike-red);
        color: var(--strike-red);
      }

      button.danger-lg {
        background: var(--strike-red);
        color: #fff;
        border: none;
        font-weight: 700;
        font-size: 0.95rem;
        padding: 0.75rem 1rem;
        width: 100%;
      }

      button.danger-lg:hover {
        background: #e03e3e;
        border-color: transparent;
      }

      button.control-btn.active {
        background: var(--accent);
        color: #10131a;
        border-color: var(--accent);
        font-weight: 700;
      }

      .answer-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.4rem 0.5rem;
        border-radius: 0.4rem;
        margin-bottom: 0.3rem;
      }

      .answer-row.revealed {
        background: var(--panel-2);
      }

      .answer-row .label {
        flex: 1;
      }

      .round-label {
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: 1.1rem;
        min-width: 2ch;
        text-align: center;
      }

      .status-line {
        font-size: 0.85rem;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="breadcrumb">
        <a href="/">Many Game Show</a>
        <span class="crumb-sep">›</span>
        Squad Squabble
      </h1>
      <div class="tabs">
        <button id="tab-display" onclick="switchView('display')">Display</button>
        <button id="tab-control" onclick="switchView('control')">Control</button>
      </div>
      <select id="theme-select" onchange="applyTheme(this.value)">
        <option value="default">Default</option>
        <option value="stage">Stage</option>
        <option value="bright">Bright</option>
      </select>
      <span id="conn-badge" class="conn-badge ok">Connected</span>
      <button id="header-collapse-btn"
              class="icon-btn"
              onclick="collapseHeader()"
              hidden>Hide header</button>
    </header>
    <div id="mini-header" hidden>
      <span id="mini-led" class="mini-led ok"></span>
      <button class="icon-btn" onclick="expandHeader()">Show header</button>
    </div>
    <main>
      <section id="view-display">
        <div id="round-display">ROUND 1</div>
        <div class="question-flip-outer">
          <div id="question-card">
            <div class="question-face" id="question-front">Round in progress…</div>
            <div class="question-face" id="question-back"></div>
          </div>
        </div>
        <div class="board" id="board"></div>
        <div class="scoreboard">
          <div class="round-score-row">
            <div class="round-score-label">Round Score</div>
            <div class="round-score-value display-num" id="round-score-display">0</div>
          </div>
          <div class="mid-stats">
            <div class="multiplier-badge" id="multiplier-display">1x</div>
            <div class="strikes" id="strikes-display"></div>
          </div>
          <div class="team-scores-row">
            <div class="team-card" id="team1-card">
              <div class="team-name" id="team1-name-display">Team 1</div>
              <div class="team-score display-num" id="team1-score-display">0</div>
            </div>
            <div class="team-card" id="team2-card">
              <div class="team-name" id="team2-name-display">Team 2</div>
              <div class="team-score display-num" id="team2-score-display">0</div>
            </div>
          </div>
        </div>
      </section>
      <section id="view-control" hidden>
        <fieldset>
          <legend>Teams</legend>
          <div class="row">
            <input type="text" id="team1-input" placeholder="Team 1 name" />
            <button onclick="updateTeamName(1)">Save</button>
          </div>
          <div class="row">
            <input type="text" id="team2-input" placeholder="Team 2 name" />
            <button onclick="updateTeamName(2)">Save</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Scores</legend>
          <div class="row">
            <span>Team 1</span>
            <input type="number" id="team1-score-input" value="0" />
            <button onclick="setScore(1)">Set score</button>
            <button onclick="resetScore(1)">Reset to 0</button>
          </div>
          <div class="row">
            <span>Team 2</span>
            <input type="number" id="team2-score-input" value="0" />
            <button onclick="setScore(2)">Set score</button>
            <button onclick="resetScore(2)">Reset to 0</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Round</legend>
          <div class="row">
            <button onclick="roundDecrement()">Round -</button>
            <span class="round-label" id="round-value">1</span>
            <button onclick="roundIncrement()">Round +</button>
            <input type="number" id="round-input" value="1" style="max-width: 5rem" />
            <button onclick="setRound()">Set round</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Load Question</legend>
          <div class="row">
            <select id="question-select"></select>
            <select id="multiplier-select">
              <option value="1">1x</option>
              <option value="2">2x</option>
              <option value="3">3x</option>
            </select>
            <button class="primary" onclick="loadQuestion()">Load</button>
            <button onclick="unloadQuestion()">Unload Question</button>
          </div>
          <div class="row">
            <button id="question-visibility-btn" onclick="toggleQuestionVisibility()">Show Question</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Face-off (who controls the board)</legend>
          <div class="row">
            <button class="control-btn"
                    id="team1-controls-btn"
                    onclick="faceOff('team1')">Team 1 controls</button>
            <button class="control-btn"
                    id="team2-controls-btn"
                    onclick="faceOff('team2')">Team 2 controls</button>
            <button onclick="faceOff(null)">Clear control</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Answers — tap as contestants give them</legend>
          <div id="answer-list"></div>
        </fieldset>
        <fieldset>
          <legend>Strikes</legend>
          <div class="row">
            <button onclick="strike()" id="strike-btn">Add strike</button>
            <button onclick="strikeMax()">3 Strikes</button>
            <button onclick="resetStrikes()">Reset strikes</button>
          </div>
          <div class="row">
            <button class="danger" onclick="revealRemaining()">Reveal remaining answers</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Strike Animation (Display)</legend>
          <div class="row">
            <label for="strike-hold-input">Hold (ms)</label>
            <input type="number" id="strike-hold-input" value="1000" min="0" max="5000" />
            <label for="strike-duration-input">Shrink (ms)</label>
            <input type="number"
                   id="strike-duration-input"
                   value="800"
                   min="100"
                   max="5000" />
            <button onclick="setStrikeAnimation()">Set timing</button>
          </div>
        </fieldset>
        <fieldset>
          <legend>Award Round</legend>
          <div class="row">
            <span>Round score: <strong id="round-score-value">0</strong></span>
          </div>
          <div class="row">
            <button class="primary" onclick="awardRound('team1')">Award to Team 1</button>
            <button class="primary" onclick="awardRound('team2')">Award to Team 2</button>
          </div>
        </fieldset>
        <div class="status-line" id="status-line"></div>
        <button class="danger-lg" onclick="resetGame()">Reset Game</button>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const gameId = params.get("id");
      let currentView = params.get("view") || "display";
      let state = null;
      let failCount = 0;
      let lastStateJson = null;
      let lastStrikesForAnim = null;
      let headerCollapsed = localStorage.getItem("mgsHeaderCollapsed") === "1";
      let boardQuestionId = null;
      let boardRowEls = [];

      // Board rows are flip-cards (vertical, rotateX — the question card
      // flips horizontally). Rows are only rebuilt from scratch when the
      // loaded question changes; otherwise the same DOM nodes are reused
      // and just have their "flipped" class toggled, so the CSS transition
      // actually has an old state to animate from.
      function renderBoard(q) {
        const board = document.getElementById("board");
        if (!q) {
          board.innerHTML = "";
          boardQuestionId = null;
          boardRowEls = [];
          return;
        }

        if (boardQuestionId !== q.id) {
          board.innerHTML = "";
          boardRowEls = q.answers.map(() => {
            const outer = document.createElement("div");
            outer.className = "board-flip-outer";
            outer.innerHTML =
              '<div class="board-row hidden-row">' +
              '<div class="board-face board-front">' +
              '<span class="answer-text">?????</span><span class="points">&nbsp;</span>' +
              "</div>" +
              '<div class="board-face board-back">' +
              '<span class="answer-text"></span><span class="points"></span>' +
              "</div>" +
              "</div>";
            board.appendChild(outer);
            return outer.querySelector(".board-row");
          });
          boardQuestionId = q.id;
        }

        q.answers.forEach((a, i) => {
          const rowEl = boardRowEls[i];
          if (!rowEl) return;
          rowEl.classList.toggle("flipped", a.revealed);
          rowEl.classList.toggle("hidden-row", !a.revealed);
          const back = rowEl.querySelector(".board-back");
          back.querySelector(".answer-text").textContent = a.text;
          back.querySelector(".points").textContent = a.points;
        });
      }

      if (!gameId) {
        document.body.innerHTML =
          '<p style="padding:2rem;color:#f29c7c">No game id in URL. Create a game from the lobby first.</p>';
        throw new Error("missing game id");
      }

      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        localStorage.setItem("mgsTheme", t);
        document.getElementById("theme-select").value = t;
      }
      applyTheme(localStorage.getItem("mgsTheme") || "default");

      function switchView(v) {
        currentView = v;
        document.getElementById("view-display").hidden = v !== "display";
        document.getElementById("view-control").hidden = v !== "control";
        document.getElementById("tab-display").classList.toggle("active", v === "display");
        document.getElementById("tab-control").classList.toggle("active", v === "control");
        const url = new URL(location.href);
        url.searchParams.set("view", v);
        history.replaceState(null, "", url);
        updateHeaderChrome();
      }
      switchView(currentView);

      // The collapse-to-LED affordance only applies on Display (a big
      // screen the audience watches) — Control always needs its tabs and
      // theme select visible to operate the game.
      function updateHeaderChrome() {
        const collapseBtn = document.getElementById("header-collapse-btn");
        const header = document.querySelector("header");
        const miniHeader = document.getElementById("mini-header");

        if (currentView !== "display") {
          collapseBtn.hidden = true;
          header.hidden = false;
          miniHeader.hidden = true;
          return;
        }

        collapseBtn.hidden = false;
        header.hidden = headerCollapsed;
        miniHeader.hidden = !headerCollapsed;
      }

      function collapseHeader() {
        headerCollapsed = true;
        localStorage.setItem("mgsHeaderCollapsed", "1");
        updateHeaderChrome();
      }

      function expandHeader() {
        headerCollapsed = false;
        localStorage.setItem("mgsHeaderCollapsed", "0");
        updateHeaderChrome();
      }

      function setConnStatus(ok) {
        const badge = document.getElementById("conn-badge");
        badge.textContent = ok ? "Connected" : "Signal Lost";
        badge.className = "conn-badge " + (ok ? "ok" : "lost");
        document.getElementById("mini-led").className = "mini-led " + (ok ? "ok" : "lost");
      }

      async function api(path, options) {
        const resp = await fetch(`/api/squad-squabble/games/${gameId}${path}`, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          throw new Error(body.detail || `HTTP ${resp.status}`);
        }
        return resp.json();
      }

      async function patch(path, body) {
        try {
          const newState = await api(path, {
            method: "PATCH",
            body: JSON.stringify(body === undefined ? {} : body),
          });
          applyState(newState);
          setStatus("");
        } catch (e) {
          setStatus(String(e.message || e));
        }
      }

      function setStatus(msg) {
        document.getElementById("status-line").textContent = msg;
      }

      // Only re-render (and re-run animations) when the state actually
      // changed since the last render. Without this, the 200ms poll loop
      // rebuilds the whole answer list every tick even when nothing
      // changed, which can eat a click if a rebuild lands between
      // mousedown and mouseup on a button.
      function applyState(newState) {
        const json = JSON.stringify(newState);
        if (json === lastStateJson) return;
        lastStateJson = json;
        state = newState;
        render();
      }

      async function poll() {
        try {
          const resp = await fetch(`/api/squad-squabble/games/${gameId}`);
          if (!resp.ok) {
            failCount++;
            if (failCount >= 3) setConnStatus(false);
            return;
          }
          const newState = await resp.json();
          failCount = 0;
          setConnStatus(true);
          applyState(newState);
        } catch (e) {
          failCount++;
          if (failCount >= 3) setConnStatus(false);
        }
      }

      let questionBank = [];
      async function loadQuestionBank() {
        questionBank = await api("/questions", { method: "GET" });
        const sel = document.getElementById("question-select");
        sel.innerHTML = questionBank
          .map(
            (q) =>
              `<option value="${q.id}">${q.prompt} (${q.answers.length})</option>`
          )
          .join("");
      }

      function loadQuestion() {
        const question_id = document.getElementById("question-select").value;
        const multiplier = Number(document.getElementById("multiplier-select").value);
        patch("/load-question", { question_id, multiplier });
      }

      function unloadQuestion() {
        patch("/unload-question");
      }

      function toggleQuestionVisibility() {
        patch("/question-visibility", { visible: !state.question_visible });
      }

      function faceOff(team) {
        patch("/face-off", { team });
      }

      function revealAnswer(index) {
        patch("/reveal", { answer_index: index });
      }

      function unrevealAnswer(index) {
        patch("/unreveal", { answer_index: index });
      }

      function revealRemaining() {
        patch("/reveal-remaining");
      }

      function strike() {
        patch("/strike");
      }

      function strikeMax() {
        patch("/strike/max");
      }

      function resetStrikes() {
        patch("/strike/reset");
      }

      function awardRound(team) {
        patch("/award-round", { team });
      }

      function resetGame() {
        if (
          !confirm(
            "Reset the whole game? Scores, round, and the loaded question will be cleared. Team names are kept."
          )
        ) {
          return;
        }
        patch("/reset");
      }

      function setScore(n) {
        const value = Number(document.getElementById(`team${n}-score-input`).value);
        patch("/score", { team: n === 1 ? "team1" : "team2", value });
      }

      function resetScore(n) {
        patch("/score", { team: n === 1 ? "team1" : "team2", value: 0 });
      }

      function roundIncrement() {
        patch("/round/increment");
      }

      function roundDecrement() {
        patch("/round/decrement");
      }

      function setRound() {
        const round_number = Number(document.getElementById("round-input").value);
        patch("/round", { round_number });
      }

      function setStrikeAnimation() {
        const hold_ms = Number(document.getElementById("strike-hold-input").value);
        const duration_ms = Number(
          document.getElementById("strike-duration-input").value
        );
        patch("/strike-animation", { hold_ms, duration_ms });
      }

      function updateTeamName(n) {
        const value = document.getElementById(`team${n}-input`).value.trim();
        if (!value) return;
        patch("/teams", n === 1 ? { team1_name: value } : { team2_name: value });
      }

      // FLIP-technique animation: spawn `count` huge red Xs centered on
      // screen, then animate each to the real (already-lit) indicator dot's
      // position/size and fade out, so the "landing" reads as the big X
      // shrinking into place.
      function triggerStrikeAnimation(count, holdMs, durationMs) {
        const targets = document.querySelectorAll("#strikes-display .strike-x");
        if (!targets.length || !count) return;

        const overlay = document.createElement("div");
        overlay.className = "strike-overlay";
        // Center the spawn point on the answer board's vertical space
        // instead of the whole viewport, so the Xs start right where the
        // action is. Falls back to the full viewport if the board isn't
        // present/measurable for some reason.
        const boardEl = document.getElementById("board");
        const boardRect = boardEl ? boardEl.getBoundingClientRect() : null;
        if (boardRect && boardRect.width > 0 && boardRect.height > 0) {
          overlay.style.top = `${boardRect.top}px`;
          overlay.style.left = `${boardRect.left}px`;
          overlay.style.width = `${boardRect.width}px`;
          overlay.style.height = `${boardRect.height}px`;
        } else {
          overlay.style.top = "0";
          overlay.style.left = "0";
          overlay.style.width = "100vw";
          overlay.style.height = "100vh";
        }
        const items = [];
        for (let i = 0; i < count; i++) {
          const el = document.createElement("div");
          el.className = "strike-overlay-x";
          el.textContent = "X";
          overlay.appendChild(el);
          items.push(el);
        }
        document.body.appendChild(overlay);

        // Hold at full size for holdMs before shrinking into place — the
        // Xs spawn immediately (so they're visible right away) but don't
        // start moving/shrinking until the hold elapses.
        setTimeout(() => {
          const durationSec = durationMs / 1000;
          items.forEach((el, i) => {
            const target = targets[i];
            if (!target) {
              el.remove();
              return;
            }
            const tRect = target.getBoundingClientRect();
            const eRect = el.getBoundingClientRect();
            const scale = tRect.width / eRect.width;
            const dx = tRect.left + tRect.width / 2 - (eRect.left + eRect.width / 2);
            const dy = tRect.top + tRect.height / 2 - (eRect.top + eRect.height / 2);
            el.style.transition =
              `transform ${durationSec}s cubic-bezier(.2,.8,.2,1), ` +
              `opacity ${durationSec}s ease-in`;
            el.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
            el.style.opacity = "0";
          });
          setTimeout(() => overlay.remove(), durationMs + 50);
        }, holdMs);
      }

      function render() {
        if (!state) return;

        // ----- Display -----
        document.getElementById("round-display").textContent =
          `ROUND ${state.current_round}`;

        const q = state.current_question;
        document.getElementById("question-back").textContent = q
          ? q.prompt
          : "";
        document.getElementById("question-card").className = state.question_visible
          ? "flipped"
          : "";

        renderBoard(q);

        document.getElementById("team1-name-display").textContent = state.team1_name;
        document.getElementById("team2-name-display").textContent = state.team2_name;
        document.getElementById("team1-score-display").textContent = state.team1_score;
        document.getElementById("team2-score-display").textContent = state.team2_score;
        document.getElementById("round-score-display").textContent = state.round_points;
        document
          .getElementById("team1-card")
          .classList.toggle("controlling", state.controlling_team === "team1");
        document
          .getElementById("team2-card")
          .classList.toggle("controlling", state.controlling_team === "team2");
        document.getElementById("multiplier-display").textContent = `${state.multiplier}x`;

        const strikesEl = document.getElementById("strikes-display");
        strikesEl.innerHTML = "";
        for (let i = 0; i < 3; i++) {
          const x = document.createElement("div");
          x.className = "strike-x" + (i < state.strikes ? " on" : "");
          x.textContent = "X";
          strikesEl.appendChild(x);
        }

        if (
          currentView === "display" &&
          lastStrikesForAnim !== null &&
          state.strikes > lastStrikesForAnim
        ) {
          triggerStrikeAnimation(
            state.strikes,
            state.strike_anim_hold_ms,
            state.strike_anim_duration_ms
          );
        }
        lastStrikesForAnim = state.strikes;

        // ----- Control -----
        if (document.activeElement.id !== "team1-input") {
          document.getElementById("team1-input").placeholder = state.team1_name;
        }
        if (document.activeElement.id !== "team2-input") {
          document.getElementById("team2-input").placeholder = state.team2_name;
        }
        if (document.activeElement.id !== "team1-score-input") {
          document.getElementById("team1-score-input").value = state.team1_score;
        }
        if (document.activeElement.id !== "team2-score-input") {
          document.getElementById("team2-score-input").value = state.team2_score;
        }
        if (document.activeElement.id !== "round-input") {
          document.getElementById("round-input").value = state.current_round;
        }
        if (document.activeElement.id !== "strike-hold-input") {
          document.getElementById("strike-hold-input").value = state.strike_anim_hold_ms;
        }
        if (document.activeElement.id !== "strike-duration-input") {
          document.getElementById("strike-duration-input").value =
            state.strike_anim_duration_ms;
        }

        document.getElementById("round-value").textContent = state.current_round;
        document.getElementById("round-score-value").textContent = state.round_points;

        document
          .getElementById("question-visibility-btn")
          .textContent = state.question_visible ? "Hide Question" : "Show Question";

        document
          .getElementById("team1-controls-btn")
          .classList.toggle("active", state.controlling_team === "team1");
        document
          .getElementById("team2-controls-btn")
          .classList.toggle("active", state.controlling_team === "team2");

        const answerList = document.getElementById("answer-list");
        answerList.innerHTML = "";
        if (q) {
          q.answers.forEach((a, i) => {
            const row = document.createElement("div");
            row.className = "answer-row" + (a.revealed ? " revealed" : "");
            const btn = a.revealed
              ? `<button class="unreveal-btn" onclick="unrevealAnswer(${i})">Unreveal</button>`
              : `<button class="reveal-btn" onclick="revealAnswer(${i})">Reveal (+${
                  a.points * state.multiplier
                })</button>`;
            row.innerHTML = `<span class="label">${a.text} <em>(${a.points} pts)</em></span>${btn}`;
            answerList.appendChild(row);
          });
        } else {
          answerList.innerHTML = '<p class="status-line">Load a question first.</p>';
        }

        document.getElementById("strike-btn").disabled = state.strikes >= 3;
      }

      loadQuestionBank();
      poll();
      setInterval(poll, 200);
    </script>
  </body>
</html>
