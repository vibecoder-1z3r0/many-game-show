<!DOCTYPE html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speed Points</title>
    <style>
      /* Self-hosted (not Google Fonts CDN) so the display font still loads
         on flaky/offline conference wifi — see UI_LOOK_AND_FEEL.md. */
      @font-face {
        font-family: "Orbitron";
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/orbitron-600.ttf") format("truetype");
      }

      @font-face {
        font-family: "Orbitron";
        font-weight: 800;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/orbitron-800.ttf") format("truetype");
      }

      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --panel-2: #1a2540;
        --text: #f5f7fa;
        --text-dim: #9aa5b8;
        --accent: #ffcc00;
        --border: #263252;
        --win-green: #2ecc71;
      }

      [data-theme="stage"] {
        --bg: #05060a;
        --panel: #12141c;
        --panel-2: #1b1f2b;
        --text: #f2f2f5;
        --text-dim: #8b8f9c;
        --accent: #00e5ff;
        --border: #2a2f3d;
      }

      [data-theme="bright"] {
        --bg: #fef6e4;
        --panel: #ffffff;
        --panel-2: #fff1d6;
        --text: #1b1b1b;
        --text-dim: #6b6b6b;
        --accent: #ff5a3c;
        --border: #f0d9b5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }

      .display-num {
        font-family: "Orbitron", system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }

      header h1 {
        font-size: 1rem;
        margin: 0;
        margin-right: auto;
      }

      .breadcrumb a {
        color: var(--text-dim);
        text-decoration: none;
      }

      .breadcrumb a:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .crumb-sep {
        color: var(--text-dim);
        margin: 0 0.3rem;
      }

      .tabs {
        display: flex;
        gap: 0.4rem;
      }

      .tabs button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.35rem 0.8rem;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .tabs button.active {
        background: var(--accent);
        color: #10131a;
        border-color: var(--accent);
        font-weight: 700;
      }

      select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.3rem 0.5rem;
        font-size: 0.8rem;
      }

      .conn-badge {
        font-size: 0.75rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-weight: 600;
      }

      .conn-badge.ok {
        background: #1e4d2b;
        color: #7cf29c;
      }

      .conn-badge.lost {
        background: #4d1e1e;
        color: #f29c7c;
      }

      .icon-btn {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.35rem 0.6rem;
        cursor: pointer;
        font-size: 0.85rem;
      }

      #mini-header {
        position: fixed;
        top: 0.6rem;
        right: 0.6rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.5rem 0.35rem 0.7rem;
        z-index: 100;
      }

      .mini-led {
        width: 0.8rem;
        height: 0.8rem;
        border-radius: 50%;
      }

      .mini-led.ok {
        background: #2ecc71;
        box-shadow: 0 0 8px 1px rgba(46, 204, 113, 0.7);
      }

      .mini-led.lost {
        background: #ff4d4d;
        box-shadow: 0 0 8px 1px rgba(255, 77, 77, 0.7);
      }

      main {
        padding: 1rem;
      }

      [hidden] {
        display: none !important;
      }

      button {
        font-family: inherit;
      }

      /* ---------- Shared: tally strip (both views) ---------- */

      .tally-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0.4rem 0;
      }

      .tally-name {
        min-width: 6ch;
        font-weight: 700;
      }

      .tally-slots {
        display: flex;
        gap: 0.4rem;
      }

      .tally-slot {
        width: clamp(2.2rem, 6vw, 3.2rem);
        height: clamp(2.2rem, 6vw, 3.2rem);
        border-radius: 0.4rem;
        border: 1px solid var(--border);
        background: var(--panel-2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 700;
        color: var(--text-dim);
        font-size: clamp(0.9rem, 2.4vw, 1.3rem);
      }

      .tally-slot.filled {
        color: var(--accent);
        border-color: var(--accent);
      }

      .tally-slot.pending {
        color: var(--text-dim);
        border-color: var(--text-dim);
        border-style: dashed;
      }

      .tally-total {
        margin-left: auto;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(1rem, 2.6vw, 1.5rem);
      }

      /* ---------- Main (Display) tallies: text-then-points reveal ---------- */
      /* Each question is its own row, split into two separate chip cards —
         a wide answer chip and a narrow points chip — not one merged box,
         so the two reveal beats (text, then points) read as genuinely
         distinct pieces even before the points chip fills in. */

      /* Player 1 on the left, Player 2 on the right — each an equal-width
         column: name, then the vertical slot stack, then the running
         total at the bottom. */
      #display-tallies {
        display: flex;
        gap: 1rem;
        width: 100%;
        align-items: flex-start;
      }

      .player-column {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .player-column .tally-name {
        text-align: center;
        font-size: clamp(1rem, 2.6vw, 1.4rem);
      }

      .player-column .tally-total {
        text-align: center;
        font-size: clamp(1.4rem, 3.4vw, 2rem);
      }

      #display-tallies .tally-slots {
        flex-direction: column;
        width: 100%;
        gap: 0.5rem;
      }

      .slot-row {
        display: flex;
        gap: 0.5rem;
        width: 100%;
      }

      .slot-card {
        border-radius: 0.4rem;
        border: 1px solid var(--border);
        background: var(--panel-2);
        display: flex;
        align-items: center;
        padding: 0.4rem 0.75rem;
        min-height: clamp(2.4rem, 6vw, 3.2rem);
        font-size: clamp(1rem, 2.4vw, 1.5rem);
      }

      .answer-chip {
        flex: 1;
        color: var(--text-dim);
      }

      .answer-chip.pending,
      .answer-chip.filled {
        color: var(--text);
      }

      .points-chip {
        min-width: clamp(3.5rem, 9vw, 5rem);
        justify-content: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 700;
        color: var(--text-dim);
      }

      .points-chip.filled {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* ---------- Display view ---------- */

      #view-display {
        display: flex;
        flex-direction: column;
        gap: clamp(0.6rem, 1.5vw, 1rem);
      }

      #turn-display {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1.4rem, 3.6vw, 2.2rem);
        color: var(--accent);
        letter-spacing: 0.04em;
        font-weight: 800;
      }

      #timer-display {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(2.4rem, 8vw, 5rem);
        font-weight: 800;
      }

      #display-prompt {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: clamp(0.75rem, 2vw, 1.5rem);
        text-align: center;
        font-size: clamp(1.2rem, 3vw, 2rem);
        font-weight: 600;
        min-height: clamp(4rem, 10vw, 7rem);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #combined-total-display {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        font-weight: 800;
      }

      #verdict {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1.8rem, 5vw, 3rem);
        font-weight: 800;
        padding: 0.5rem;
        border-radius: 0.5rem;
      }

      #verdict.won {
        color: var(--win-green);
      }

      /* ---------- Host / Judge views ---------- */

      #view-host,
      #view-judge {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 640px;
      }

      #host-question-list {
        margin: 0;
        padding-left: 1.4rem;
      }

      #host-question-list li {
        padding: 0.2rem 0;
        color: var(--text-dim);
      }

      #host-question-list li.current-question {
        color: var(--text);
        font-weight: 700;
      }

      #host-turn-status {
        font-weight: 600;
      }

      #host-timer {
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: 1.4rem;
      }

      button.buzzer-btn {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
        margin: 0.5rem 0;
      }

      button.buzzer-btn.active {
        background: #ff4d4d;
        color: #fff;
        border-color: #ff4d4d;
        font-weight: 700;
      }

      fieldset {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.75rem;
      }

      legend {
        color: var(--text-dim);
        font-size: 0.85rem;
        padding: 0 0.4rem;
      }

      input[type="text"],
      input[type="number"] {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.4rem 0.6rem;
      }

      button.primary {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }

      button.primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button.primary.active {
        background: var(--accent);
        color: #10131a;
        font-weight: 700;
        border-color: var(--accent);
      }

      button.danger {
        border-color: #ff4d4d;
        color: #ff4d4d;
        background: transparent;
        border-radius: 0.4rem;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }

      #current-prompt {
        font-size: 1.1rem;
        font-weight: 600;
        min-height: 3rem;
      }

      #answer-options {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }

      .award-btn {
        display: flex;
        justify-content: space-between;
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
        font-size: 0.95rem;
      }

      .award-btn:hover {
        border-color: var(--accent);
      }

      .status-line {
        font-size: 0.85rem;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="breadcrumb">
        <a href="/">Many Game Show</a>
        <span class="crumb-sep">›</span>
        Speed Points
      </h1>
      <div class="tabs">
        <button id="tab-display" onclick="switchView('display')">Display</button>
        <button id="tab-host" onclick="switchView('host')">Host</button>
        <button id="tab-judge" onclick="switchView('judge')">Judge</button>
      </div>
      <select id="theme-select" onchange="applyTheme(this.value)">
        <option value="default">Default</option>
        <option value="stage">Stage</option>
        <option value="bright">Bright</option>
      </select>
      <span id="conn-badge" class="conn-badge ok">Connected</span>
      <button id="header-collapse-btn"
              class="icon-btn"
              onclick="collapseHeader()"
              hidden>Hide header</button>
    </header>
    <div id="mini-header" hidden>
      <span id="mini-led" class="mini-led ok"></span>
      <button class="icon-btn" onclick="expandHeader()">Show header</button>
    </div>
    <main>
      <section id="view-display">
        <div id="turn-display">Waiting to start</div>
        <div id="timer-display"></div>
        <div id="display-prompt">No question in play</div>
        <div id="display-tallies"></div>
        <div id="combined-total-display"></div>
        <div id="verdict" hidden></div>
      </section>
      <section id="view-host">
        <fieldset>
          <legend>Players</legend>
          <input type="text" id="player1-input" placeholder="Player 1 name" />
          <button class="primary" onclick="updatePlayerName(1)">Set name</button>
          <br />
          <br />
          <input type="text" id="player2-input" placeholder="Player 2 name" />
          <button class="primary" onclick="updatePlayerName(2)">Set name</button>
        </fieldset>
        <fieldset>
          <legend>Round control</legend>
          <div id="host-turn-status">Waiting to start</div>
          <div id="host-timer"></div>
          <button class="primary" onclick="startRound('player1')">Start Player 1</button>
          <button class="primary" onclick="startRound('player2')">Start Player 2</button>
          <button class="primary" onclick="revealResult()">Reveal Result</button>
        </fieldset>
        <fieldset>
          <legend>Questions this round</legend>
          <ol id="host-question-list">
          </ol>
        </fieldset>
        <button class="danger" onclick="resetGame()">Reset Game</button>
        <div class="status-line" id="host-status-line"></div>
      </section>
      <section id="view-judge">
        <fieldset>
          <legend>Current question</legend>
          <div id="current-prompt">No question in play</div>
          <input type="text"
                 id="judge-answer-input"
                 placeholder="Type the contestant's answer..." />
          <button class="buzzer-btn" id="buzzer-btn" onclick="toggleDuplicateFlag()">Flag Duplicate</button>
          <div id="answer-options"></div>
          <div id="reveal-points-container"></div>
        </fieldset>
        <fieldset>
          <legend>Scores</legend>
          <div class="tally-row">
            <span class="tally-name" id="player1-name-label">Player 1</span>
            <div class="tally-slots" id="player1-tally"></div>
            <span class="tally-total" id="player1-total"></span>
          </div>
          <div class="tally-row">
            <span class="tally-name" id="player2-name-label">Player 2</span>
            <div class="tally-slots" id="player2-tally"></div>
            <span class="tally-total" id="player2-total"></span>
          </div>
        </fieldset>
        <div class="status-line" id="judge-status-line"></div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const gameId = params.get("id");
      let currentView = params.get("view") || "display";
      let state = null;
      let lastStateJson = null;
      let failCount = 0;
      let answerOptions = [];
      let answerOptionsForQuestionId = null;
      let judgeInputForQuestionId = null;
      // Tracks what's currently rendered into #answer-options and
      // #reveal-points-container, so render() only touches those buttons'
      // DOM when what should be shown actually changes (see the render()
      // comment) instead of on every poll tick.
      let renderedAnswerOptionsKey = undefined;
      let renderedShowRevealBtn = undefined;

      let headerCollapsed = localStorage.getItem("mgsHeaderCollapsed") === "1";

      if (!gameId) {
        document.body.innerHTML =
          '<p style="padding:2rem;color:#f29c7c">No game id in URL. Create a game from the lobby first.</p>';
        throw new Error("missing game id");
      }

      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        localStorage.setItem("mgsTheme", t);
        document.getElementById("theme-select").value = t;
      }
      applyTheme(localStorage.getItem("mgsTheme") || "default");

      function switchView(v) {
        currentView = v;
        document.getElementById("view-display").hidden = v !== "display";
        document.getElementById("view-host").hidden = v !== "host";
        document.getElementById("view-judge").hidden = v !== "judge";
        document.getElementById("tab-display").classList.toggle("active", v === "display");
        document.getElementById("tab-host").classList.toggle("active", v === "host");
        document.getElementById("tab-judge").classList.toggle("active", v === "judge");
        const url = new URL(location.href);
        url.searchParams.set("view", v);
        history.replaceState(null, "", url);
        updateHeaderChrome();
        // Switching away from Judge must drop any already-fetched
        // answer-options out of the DOM immediately, not just stop
        // fetching new ones — Host and Display must never see them.
        loadAnswerOptionsIfNeeded().then(render);
      }
      switchView(currentView);

      // The collapse-to-LED affordance only applies on Display (a big
      // screen the audience watches) — Control always needs its tabs and
      // theme select visible to operate the game.
      function updateHeaderChrome() {
        const collapseBtn = document.getElementById("header-collapse-btn");
        const header = document.querySelector("header");
        const miniHeader = document.getElementById("mini-header");

        if (currentView !== "display") {
          collapseBtn.hidden = true;
          header.hidden = false;
          miniHeader.hidden = true;
          return;
        }

        collapseBtn.hidden = false;
        header.hidden = headerCollapsed;
        miniHeader.hidden = !headerCollapsed;
      }

      function collapseHeader() {
        headerCollapsed = true;
        localStorage.setItem("mgsHeaderCollapsed", "1");
        updateHeaderChrome();
      }

      function expandHeader() {
        headerCollapsed = false;
        localStorage.setItem("mgsHeaderCollapsed", "0");
        updateHeaderChrome();
      }

      function setConnStatus(ok) {
        const badge = document.getElementById("conn-badge");
        badge.textContent = ok ? "Connected" : "Signal Lost";
        badge.className = "conn-badge " + (ok ? "ok" : "lost");
        document.getElementById("mini-led").className = "mini-led " + (ok ? "ok" : "lost");
      }

      async function api(path, options) {
        const resp = await fetch(`/api/speed-points/games/${gameId}${path}`, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          throw new Error(body.detail || `HTTP ${resp.status}`);
        }
        return resp.json();
      }

      async function patch(path, body) {
        const seq = ++stateSeq;
        try {
          const newState = await api(path, {
            method: "PATCH",
            body: JSON.stringify(body === undefined ? {} : body),
          });
          applyState(newState, seq);
          setStatus("");
        } catch (e) {
          setStatus(String(e.message || e));
        }
      }

      function setStatus(msg) {
        document.getElementById("host-status-line").textContent = msg;
        document.getElementById("judge-status-line").textContent = msg;
      }

      async function loadAnswerOptionsIfNeeded() {
        // Judge-only reference — never fetch (let alone render into the
        // DOM) on Display or Host, even though the section is only
        // CSS-hidden there. A visually-hidden element's textContent is
        // still full page content, so this is the actual spoiler boundary.
        if (currentView !== "judge" || !state || !state.current_question) {
          answerOptions = [];
          answerOptionsForQuestionId = null;
          return;
        }
        if (answerOptionsForQuestionId === state.current_question.id) return;
        try {
          answerOptions = await api("/answer-options", { method: "GET" });
          answerOptionsForQuestionId = state.current_question.id;
        } catch (e) {
          answerOptions = [];
        }
      }

      // Poll (GET) and control actions (PATCH) are concurrent, independent
      // requests — nothing stops an older poll's response from arriving
      // after a newer PATCH's response (e.g. the PATCH resolves first,
      // then a GET that was already in flight before the click lands with
      // stale data). Tag every request with a sequence number and drop any
      // response older than the last one actually applied.
      let stateSeq = 0;
      let lastAppliedSeq = 0;

      function applyState(newState, seq) {
        if (seq < lastAppliedSeq) return; // stale response, ignore
        lastAppliedSeq = seq;
        const json = JSON.stringify(newState);
        if (json === lastStateJson) return;
        lastStateJson = json;
        state = newState;
        loadAnswerOptionsIfNeeded().then(render);
        render();
      }

      async function poll() {
        const seq = ++stateSeq;
        try {
          const resp = await fetch(`/api/speed-points/games/${gameId}`);
          if (!resp.ok) {
            failCount++;
            if (failCount >= 3) setConnStatus(false);
            return;
          }
          const newState = await resp.json();
          failCount = 0;
          setConnStatus(true);
          applyState(newState, seq);
        } catch (e) {
          failCount++;
          if (failCount >= 3) setConnStatus(false);
        }
      }

      function updatePlayerName(n) {
        const value = document.getElementById(`player${n}-input`).value.trim();
        if (!value) return;
        patch("/players", n === 1 ? { player1_name: value } : { player2_name: value });
      }

      function startRound(player) {
        patch("/start-round", { player });
      }

      function typedAnswerText() {
        return document.getElementById("judge-answer-input").value.trim();
      }

      function awardOption(i) {
        const text = typedAnswerText();
        if (!text) {
          setStatus("Type the contestant's answer before awarding points.");
          return;
        }
        const a = answerOptions[i];
        patch("/award", { text, points: a.points });
      }

      function awardNoMatch() {
        const text = typedAnswerText() || "No match";
        patch("/award", { text, points: 0 });
      }

      function toggleDuplicateFlag() {
        patch("/duplicate-flag", {
          flagged: !(state && state.pending_duplicate_flag),
        });
      }

      function revealPoints() {
        patch("/reveal-points");
      }

      function revealResult() {
        patch("/reveal-result");
      }

      function resetGame() {
        if (!confirm("Reset this game? Scores and round progress will be cleared.")) {
          return;
        }
        patch("/reset");
      }

      // Compact scoreboard tile for Judge: a small square that just needs
      // to say "not yet / pending / this many points" — the currently
      // typed-in answer is already visible above in the input, so
      // repeating past answers here would only fit truncated.
      function judgeTallySlotsHtml(slots) {
        return slots
          .map((s) => {
            if (!s || s.text === null) return '<span class="tally-slot">-</span>';
            if (s.points === null)
              return '<span class="tally-slot pending">…</span>';
            return `<span class="tally-slot filled">${s.points}</span>`;
          })
          .join("");
      }

      // Rich per-question row for the Main view: two separate chip cards
      // (a wide answer chip, a narrow points chip), not one merged box —
      // the audience sees the matched answer's text as soon as the judge
      // picks it (reveal beat one), then the point value once the judge
      // separately reveals it (reveal beat two).
      function mainTallySlotsHtml(slots) {
        return slots
          .map((s) => {
            const hasText = !!s && s.text !== null;
            const hasPoints = !!s && s.points !== null;
            const answerCls = hasPoints ? "filled" : hasText ? "pending" : "";
            const text = hasText ? s.text : "-";
            const points = hasPoints ? s.points : "";
            return (
              '<div class="slot-row">' +
              `<div class="slot-card answer-chip${answerCls ? " " + answerCls : ""}">${text}</div>` +
              `<div class="slot-card points-chip${hasPoints ? " filled" : ""}">${points}</div>` +
              "</div>"
            );
          })
          .join("");
      }

      function turnStatusText() {
        if (!state || !state.current_player) return "Waiting to start";
        const name =
          state.current_player === "player1" ? state.player1_name : state.player2_name;
        return `${name}'s turn — Q${Math.min(state.current_question_index + 1, 5)} of 5`;
      }

      // The slot the judge is currently deciding on: text already chosen
      // (visible on Main) but points not yet revealed. Drives whether the
      // Reveal Points button shows.
      function pendingSlot() {
        if (!state || !state.current_player) return null;
        const slots =
          state.current_player === "player1" ? state.player1_slots : state.player2_slots;
        const slot = slots[state.current_question_index];
        return slot && slot.text !== null && slot.points === null ? slot : null;
      }

      function render() {
        if (!state) return;

        document.getElementById("player1-name-label").textContent = state.player1_name;
        document.getElementById("player2-name-label").textContent = state.player2_name;
        document.getElementById("player1-tally").innerHTML = judgeTallySlotsHtml(
          state.player1_slots
        );
        document.getElementById("player2-tally").innerHTML = judgeTallySlotsHtml(
          state.player2_slots
        );
        document.getElementById("player1-total").textContent = state.player1_total;
        document.getElementById("player2-total").textContent = state.player2_total;

        // ----- Judge -----
        const currentPromptEl = document.getElementById("current-prompt");
        currentPromptEl.textContent = state.current_question
          ? state.current_question.prompt
          : "No question in play";
        currentPromptEl.dataset.questionId = state.current_question
          ? state.current_question.id
          : "";

        // A fresh question always clears whatever was typed for the last
        // one; mid-question poll ticks must never clobber active typing.
        const judgeInput = document.getElementById("judge-answer-input");
        const currentQid = state.current_question ? state.current_question.id : null;
        if (currentQid !== judgeInputForQuestionId) {
          judgeInput.value = "";
          judgeInputForQuestionId = currentQid;
        }

        const buzzerBtn = document.getElementById("buzzer-btn");
        const flagged = !!state.pending_duplicate_flag;
        buzzerBtn.textContent = flagged
          ? "Duplicate flagged (click to clear)"
          : "Flag Duplicate";
        buzzerBtn.classList.toggle("active", flagged);

        // render() runs on every poll tick where *anything* in state
        // differs — including remaining_seconds ticking down once a
        // second — not just when the judge does something. Rebuilding
        // these buttons' innerHTML unconditionally on every call risks
        // replacing the exact button a click is mid-flight on (mousedown
        // landing on a node that's gone by mouseup). Only touch the DOM
        // when what should be shown has actually changed.
        // Key on answerOptionsForQuestionId (set only once the fetch for
        // the *current* question resolves), not just current_question.id —
        // right after a question changes, current_question.id updates
        // synchronously but the still-stale `answerOptions` array (last
        // question's) hasn't been replaced yet, so keying on the id alone
        // would rebuild with the wrong data and then skip the real rebuild
        // once the fresh fetch actually lands.
        const optsEl = document.getElementById("answer-options");
        const optsKey =
          state.current_question &&
          answerOptions.length &&
          answerOptionsForQuestionId === state.current_question.id
            ? state.current_question.id
            : null;
        // Exposes the same freshness signal the rebuild itself is gated
        // on, so a test (or anything else) can wait for "the options
        // showing are actually this question's" rather than guessing
        // from timing — button count alone can't tell old vs. new apart
        // since every question has exactly 5 options + no-match.
        optsEl.dataset.ready = optsKey || "";
        if (optsKey !== renderedAnswerOptionsKey) {
          renderedAnswerOptionsKey = optsKey;
          optsEl.innerHTML = optsKey
            ? answerOptions
                .map(
                  (a, i) =>
                    `<button class="award-btn" onclick="awardOption(${i})">` +
                    `<span>${a.text}</span><span>${a.points} pts</span></button>`
                )
                .join("") +
              `<button class="award-btn" onclick="awardNoMatch()">No match (0)</button>`
            : "";
        }

        const revealBtnEl = document.getElementById("reveal-points-container");
        const showRevealBtn = !!pendingSlot();
        if (showRevealBtn !== renderedShowRevealBtn) {
          renderedShowRevealBtn = showRevealBtn;
          revealBtnEl.innerHTML = showRevealBtn
            ? '<button class="primary" onclick="revealPoints()">Reveal Points</button>'
            : "";
        }

        // ----- Host -----
        document.getElementById("host-turn-status").textContent = turnStatusText();
        document.getElementById("host-timer").textContent =
          state.remaining_seconds !== null ? `${state.remaining_seconds}s` : "";
        document.getElementById("host-question-list").innerHTML = state.all_questions
          .map(
            (q, i) =>
              `<li class="${
                state.current_player && i === state.current_question_index
                  ? "current-question"
                  : ""
              }">${q.prompt}</li>`
          )
          .join("");

        // ----- Display -----
        document.getElementById("turn-display").textContent = turnStatusText();

        document.getElementById("timer-display").textContent =
          state.remaining_seconds !== null ? `${state.remaining_seconds}s` : "";

        document.getElementById("display-prompt").textContent = state.current_question
          ? state.current_question.prompt
          : "No question in play";

        document.getElementById("display-tallies").innerHTML = `
          <div class="player-column">
            <div class="tally-name">${state.player1_name}</div>
            <div class="tally-slots">${mainTallySlotsHtml(state.player1_slots)}</div>
            <div class="tally-total display-num">${state.player1_total}</div>
          </div>
          <div class="player-column">
            <div class="tally-name">${state.player2_name}</div>
            <div class="tally-slots">${mainTallySlotsHtml(state.player2_slots)}</div>
            <div class="tally-total display-num">${state.player2_total}</div>
          </div>`;

        document.getElementById("combined-total-display").textContent =
          `Combined: ${state.combined_total} / ${state.win_threshold}`;

        const verdictEl = document.getElementById("verdict");
        if (state.scores_revealed) {
          verdictEl.hidden = false;
          verdictEl.className = state.won ? "won" : "";
          verdictEl.textContent = state.won
            ? `WINNER! ${state.combined_total} points!`
            : `${state.combined_total} / ${state.win_threshold} — so close!`;
        } else {
          verdictEl.hidden = true;
        }
      }

      poll();
      setInterval(poll, 200);
    </script>
  </body>
</html>
