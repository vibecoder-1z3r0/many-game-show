<!DOCTYPE html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speed Points</title>
    <style>
      /* Self-hosted (not Google Fonts CDN) so the display font still loads
         on flaky/offline conference wifi — see UI_LOOK_AND_FEEL.md. */
      @font-face {
        font-family: "Orbitron";
        font-weight: 600;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/orbitron-600.ttf") format("truetype");
      }

      @font-face {
        font-family: "Orbitron";
        font-weight: 800;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/orbitron-800.ttf") format("truetype");
      }

      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --panel-2: #1a2540;
        --text: #f5f7fa;
        --text-dim: #9aa5b8;
        --accent: #ffcc00;
        --border: #263252;
        --win-green: #2ecc71;
      }

      [data-theme="stage"] {
        --bg: #05060a;
        --panel: #12141c;
        --panel-2: #1b1f2b;
        --text: #f2f2f5;
        --text-dim: #8b8f9c;
        --accent: #00e5ff;
        --border: #2a2f3d;
      }

      [data-theme="bright"] {
        --bg: #fef6e4;
        --panel: #ffffff;
        --panel-2: #fff1d6;
        --text: #1b1b1b;
        --text-dim: #6b6b6b;
        --accent: #ff5a3c;
        --border: #f0d9b5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
      }

      .display-num {
        font-family: "Orbitron", system-ui, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.6rem 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }

      header h1 {
        font-size: 1rem;
        margin: 0;
        margin-right: auto;
      }

      .breadcrumb a {
        color: var(--text-dim);
        text-decoration: none;
      }

      .breadcrumb a:hover {
        color: var(--accent);
        text-decoration: underline;
      }

      .crumb-sep {
        color: var(--text-dim);
        margin: 0 0.3rem;
      }

      .tabs {
        display: flex;
        gap: 0.4rem;
      }

      .tabs button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.35rem 0.8rem;
        cursor: pointer;
        font-size: 0.85rem;
      }

      .tabs button.active {
        background: var(--accent);
        color: #10131a;
        border-color: var(--accent);
        font-weight: 700;
      }

      select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.3rem 0.5rem;
        font-size: 0.8rem;
      }

      .conn-badge {
        font-size: 0.75rem;
        padding: 0.25rem 0.6rem;
        border-radius: 999px;
        font-weight: 600;
      }

      .conn-badge.ok {
        background: #1e4d2b;
        color: #7cf29c;
      }

      .conn-badge.lost {
        background: #4d1e1e;
        color: #f29c7c;
      }

      .icon-btn {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.35rem 0.6rem;
        cursor: pointer;
        font-size: 0.85rem;
      }

      #mini-header {
        position: fixed;
        top: 0.6rem;
        right: 0.6rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.35rem 0.5rem 0.35rem 0.7rem;
        z-index: 100;
      }

      .mini-led {
        width: 0.8rem;
        height: 0.8rem;
        border-radius: 50%;
      }

      .mini-led.ok {
        background: #2ecc71;
        box-shadow: 0 0 8px 1px rgba(46, 204, 113, 0.7);
      }

      .mini-led.lost {
        background: #ff4d4d;
        box-shadow: 0 0 8px 1px rgba(255, 77, 77, 0.7);
      }

      main {
        padding: 1rem;
      }

      [hidden] {
        display: none !important;
      }

      button {
        font-family: inherit;
      }

      /* ---------- Shared: tally strip (Judge sidebar) ---------- */

      .tally-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin: 0.4rem 0;
      }

      .tally-name {
        min-width: 6ch;
        font-weight: 700;
      }

      .tally-slots {
        display: flex;
        gap: 0.4rem;
      }

      .tally-slot {
        width: clamp(2.2rem, 6vw, 3.2rem);
        height: clamp(2.2rem, 6vw, 3.2rem);
        border-radius: 0.4rem;
        border: 1px solid var(--border);
        background: var(--panel-2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 700;
        color: var(--text-dim);
        font-size: clamp(0.9rem, 2.4vw, 1.3rem);
      }

      .tally-slot.filled {
        color: var(--accent);
        border-color: var(--accent);
      }

      .tally-slot.pending {
        color: var(--text-dim);
        border-color: var(--text-dim);
        border-style: dashed;
      }

      .tally-total {
        margin-left: auto;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(1rem, 2.6vw, 1.5rem);
      }

      /* ---------- Main-view tallies: text-then-points reveal ---------- */
      /* Each question is its own row, split into two separate chip cards —
         a wide answer chip and a narrow points chip — not one merged box,
         so the two reveal beats (text, then points) read as genuinely
         distinct pieces even before the points chip fills in. */

      /* Player 1 on the left, Player 2 on the right — each an equal-width
         column: name, then the vertical slot stack, then the running
         total at the bottom. */
      #main-tallies {
        display: flex;
        gap: 1rem;
        width: 100%;
        align-items: flex-start;
      }

      .player-column {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .player-column .tally-name {
        text-align: center;
        font-size: clamp(1rem, 2.6vw, 1.4rem);
      }

      .player-column .tally-total {
        text-align: center;
        font-size: clamp(1.4rem, 3.4vw, 2rem);
      }

      #main-tallies .tally-slots {
        flex-direction: column;
        width: 100%;
        gap: 0.5rem;
      }

      .slot-row {
        display: flex;
        gap: 0.5rem;
        width: 100%;
      }

      .slot-card {
        border-radius: 0.4rem;
        border: 1px solid var(--border);
        background: var(--panel-2);
        display: flex;
        align-items: center;
        padding: 0.4rem 0.75rem;
        min-height: clamp(2.4rem, 6vw, 3.2rem);
        font-size: clamp(1rem, 2.4vw, 1.5rem);
      }

      .answer-chip {
        flex: 1;
        color: var(--text-dim);
      }

      .answer-chip.pending,
      .answer-chip.filled {
        color: var(--text);
      }

      .points-chip {
        min-width: clamp(3.5rem, 9vw, 5rem);
        justify-content: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-weight: 700;
        color: var(--text-dim);
      }

      .points-chip.filled {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* ---------- Main view ---------- */

      #view-main {
        display: flex;
        flex-direction: column;
        gap: clamp(0.6rem, 1.5vw, 1rem);
      }

      #turn-main {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1.4rem, 3.6vw, 2.2rem);
        color: var(--accent);
        letter-spacing: 0.04em;
        font-weight: 800;
      }

      #timer-main {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(2.4rem, 8vw, 5rem);
        font-weight: 800;
      }

      #combined-total-main {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        font-weight: 800;
      }

      #verdict {
        text-align: center;
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: clamp(1.8rem, 5vw, 3rem);
        font-weight: 800;
        padding: 0.5rem;
        border-radius: 0.5rem;
      }

      #verdict.won {
        color: var(--win-green);
      }

      /* ---------- Host / Judge views ---------- */

      #view-host {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 640px;
      }

      #view-judge {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 900px;
      }

      #host-question-list {
        margin: 0;
        padding-left: 1.4rem;
      }

      #host-question-list li {
        padding: 0.2rem 0;
        color: var(--text-dim);
      }

      #host-turn-status {
        font-weight: 600;
      }

      #host-timer {
        font-family: "Orbitron", system-ui, sans-serif;
        font-size: 1.4rem;
      }

      button.buzzer-btn {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
        font-size: 0.8rem;
      }

      button.buzzer-btn.active {
        background: #ff4d4d;
        color: #fff;
        border-color: #ff4d4d;
        font-weight: 700;
      }

      fieldset {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.75rem;
      }

      legend {
        color: var(--text-dim);
        font-size: 0.85rem;
        padding: 0 0.4rem;
      }

      input[type="text"],
      input[type="number"] {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.4rem 0.6rem;
      }

      input:disabled {
        opacity: 0.6;
        color: var(--accent);
      }

      button.primary {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }

      button.primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button.primary.active {
        background: var(--accent);
        color: #10131a;
        font-weight: 700;
        border-color: var(--accent);
      }

      button.danger {
        border-color: #ff4d4d;
        color: #ff4d4d;
        background: transparent;
        border-radius: 0.4rem;
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }

      .status-line {
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      /* ---------- Judge: one form row per question ---------- */

      #judge-rows {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .judge-row {
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.6rem 0.75rem;
        background: var(--panel);
      }

      .judge-row-prompt {
        font-weight: 600;
        margin-bottom: 0.4rem;
      }

      .judge-row-line {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0.3rem 0;
      }

      .judge-row-line input[type="text"] {
        flex: 1;
        min-width: 12rem;
      }

      .judge-row-line input[type="number"] {
        width: 6rem;
      }

      .quick-points {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
      }

      .quick-pt-btn {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.3rem 0.55rem;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .quick-pt-btn:hover {
        border-color: var(--accent);
      }

      .lock-btn {
        padding: 0.4rem 0.7rem;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="breadcrumb">
        <a href="/">Many Game Show</a>
        <span class="crumb-sep">›</span>
        Speed Points
      </h1>
      <div class="tabs">
        <button id="tab-main" onclick="switchView('main')">Main</button>
        <button id="tab-host" onclick="switchView('host')">Host</button>
        <button id="tab-judge" onclick="switchView('judge')">Judge</button>
      </div>
      <select id="theme-select" onchange="applyTheme(this.value)">
        <option value="default">Default</option>
        <option value="stage">Stage</option>
        <option value="bright">Bright</option>
      </select>
      <span id="conn-badge" class="conn-badge ok">Connected</span>
      <button id="header-collapse-btn"
              class="icon-btn"
              onclick="collapseHeader()"
              hidden>Hide header</button>
    </header>
    <div id="mini-header" hidden>
      <span id="mini-led" class="mini-led ok"></span>
      <button class="icon-btn" onclick="expandHeader()">Show header</button>
    </div>
    <main>
      <section id="view-main">
        <div id="turn-main">Waiting to start</div>
        <div id="timer-main"></div>
        <div id="main-tallies"></div>
        <div id="combined-total-main"></div>
        <div id="verdict" hidden></div>
      </section>
      <section id="view-host">
        <fieldset>
          <legend>Players</legend>
          <input type="text" id="player1-input" placeholder="Player 1 name" />
          <button class="primary" onclick="updatePlayerName(1)">Set name</button>
          <br />
          <br />
          <input type="text" id="player2-input" placeholder="Player 2 name" />
          <button class="primary" onclick="updatePlayerName(2)">Set name</button>
        </fieldset>
        <fieldset>
          <legend>Round control</legend>
          <div id="host-turn-status">Waiting to start</div>
          <div id="host-timer"></div>
          <button class="primary" onclick="startRound('player1')">Start Player 1</button>
          <button class="primary" onclick="startRound('player2')">Start Player 2</button>
          <button class="primary" onclick="revealResult()">Reveal Result</button>
        </fieldset>
        <fieldset>
          <legend>Questions this round</legend>
          <ol id="host-question-list">
          </ol>
        </fieldset>
        <div class="status-line" id="host-status-line"></div>
      </section>
      <section id="view-judge">
        <fieldset>
          <legend>Scores</legend>
          <div class="tally-row">
            <span class="tally-name" id="player1-name-label">Player 1</span>
            <div class="tally-slots" id="player1-tally"></div>
            <span class="tally-total" id="player1-total"></span>
          </div>
          <div class="tally-row">
            <span class="tally-name" id="player2-name-label">Player 2</span>
            <div class="tally-slots" id="player2-tally"></div>
            <span class="tally-total" id="player2-total"></span>
          </div>
        </fieldset>
        <div id="judge-no-round">Waiting for Host to start a player's round.</div>
        <div id="judge-rows"></div>
        <button class="danger" onclick="resetGame()">Reset Game</button>
        <div class="status-line" id="judge-status-line"></div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const gameId = params.get("id");
      let currentView = params.get("view") || "main";
      let state = null; // public (spoiler-safe) state: Main + Host
      let judgeState = null; // full-visibility state: Judge only
      let lastStateJson = null;
      let lastJudgeStateJson = null;
      let failCount = 0;
      let answerKey = null; // fetched once: all 5 prompts + full answer keys
      let judgeRowsBuiltForPlayer = undefined; // which player judge-rows DOM matches
      let judgeRowsBuiltWithAnswerKey = false; // whether that build had quick-fill buttons

      let headerCollapsed = localStorage.getItem("mgsHeaderCollapsed") === "1";

      if (!gameId) {
        document.body.innerHTML =
          '<p style="padding:2rem;color:#f29c7c">No game id in URL. Create a game from the lobby first.</p>';
        throw new Error("missing game id");
      }

      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        localStorage.setItem("mgsTheme", t);
        document.getElementById("theme-select").value = t;
      }
      applyTheme(localStorage.getItem("mgsTheme") || "default");

      function switchView(v) {
        currentView = v;
        document.getElementById("view-main").hidden = v !== "main";
        document.getElementById("view-host").hidden = v !== "host";
        document.getElementById("view-judge").hidden = v !== "judge";
        document.getElementById("tab-main").classList.toggle("active", v === "main");
        document.getElementById("tab-host").classList.toggle("active", v === "host");
        document.getElementById("tab-judge").classList.toggle("active", v === "judge");
        const url = new URL(location.href);
        url.searchParams.set("view", v);
        history.replaceState(null, "", url);
        updateHeaderChrome();
        poll(); // don't wait up to 200ms for the newly-active view to populate
      }
      switchView(currentView);

      // The collapse-to-LED affordance only applies on Main (a big
      // screen the audience watches) — Host/Judge always need their tabs
      // and theme select visible to operate the game.
      function updateHeaderChrome() {
        const collapseBtn = document.getElementById("header-collapse-btn");
        const header = document.querySelector("header");
        const miniHeader = document.getElementById("mini-header");

        if (currentView !== "main") {
          collapseBtn.hidden = true;
          header.hidden = false;
          miniHeader.hidden = true;
          return;
        }

        collapseBtn.hidden = false;
        header.hidden = headerCollapsed;
        miniHeader.hidden = !headerCollapsed;
      }

      function collapseHeader() {
        headerCollapsed = true;
        localStorage.setItem("mgsHeaderCollapsed", "1");
        updateHeaderChrome();
      }

      function expandHeader() {
        headerCollapsed = false;
        localStorage.setItem("mgsHeaderCollapsed", "0");
        updateHeaderChrome();
      }

      function setConnStatus(ok) {
        const badge = document.getElementById("conn-badge");
        badge.textContent = ok ? "Connected" : "Signal Lost";
        badge.className = "conn-badge " + (ok ? "ok" : "lost");
        document.getElementById("mini-led").className = "mini-led " + (ok ? "ok" : "lost");
      }

      async function api(path, options) {
        const resp = await fetch(`/api/speed-points/games/${gameId}${path}`, {
          headers: { "Content-Type": "application/json" },
          ...options,
        });
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          throw new Error(body.detail || `HTTP ${resp.status}`);
        }
        return resp.json();
      }

      async function patch(path, body) {
        try {
          const newState = await api(path, {
            method: "PATCH",
            body: JSON.stringify(body === undefined ? {} : body),
          });
          // Judge-triggered mutations return JudgeGameRead; everything
          // else returns the public SpeedPointsGameRead. Route the result
          // to the right slot rather than guessing from `path`.
          if ("player1_slots" in newState && "text_revealed" in newState.player1_slots[0]) {
            applyJudgeState(newState);
          } else {
            applyState(newState);
          }
          setStatus("");
        } catch (e) {
          setStatus(String(e.message || e));
        }
      }

      function setStatus(msg) {
        document.getElementById("host-status-line").textContent = msg;
        document.getElementById("judge-status-line").textContent = msg;
      }

      async function loadAnswerKeyIfNeeded() {
        // Judge-only reference — fetched once (it's fixed for the game's
        // lifetime) and only ever while actually on the Judge tab, so it
        // never even transits the network for Host/Main.
        if (currentView !== "judge" || answerKey) return;
        try {
          answerKey = await api("/answer-key", { method: "GET" });
          renderJudge();
        } catch (e) {
          // leave answerKey null; judge rows just won't have quick-fill yet
        }
      }

      function applyState(newState) {
        const json = JSON.stringify(newState);
        if (json === lastStateJson) return;
        lastStateJson = json;
        state = newState;
        renderMain();
        renderHost();
      }

      function applyJudgeState(newState) {
        const json = JSON.stringify(newState);
        if (json === lastJudgeStateJson) return;
        lastJudgeStateJson = json;
        judgeState = newState;
        renderJudge();
      }

      async function poll() {
        try {
          if (currentView === "judge") {
            const newState = await api("/judge", { method: "GET" });
            failCount = 0;
            setConnStatus(true);
            applyJudgeState(newState);
            loadAnswerKeyIfNeeded();
          } else {
            const resp = await fetch(`/api/speed-points/games/${gameId}`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const newState = await resp.json();
            failCount = 0;
            setConnStatus(true);
            applyState(newState);
          }
        } catch (e) {
          failCount++;
          if (failCount >= 3) setConnStatus(false);
        }
      }

      function updatePlayerName(n) {
        const value = document.getElementById(`player${n}-input`).value.trim();
        if (!value) return;
        patch("/players", n === 1 ? { player1_name: value } : { player2_name: value });
      }

      function startRound(player) {
        patch("/start-round", { player });
      }

      function revealResult() {
        patch("/reveal-result");
      }

      function resetGame() {
        if (!confirm("Reset this game? Scores and round progress will be cleared.")) {
          return;
        }
        patch("/reset");
      }

      function setAnswer(i, text) {
        patch("/answer", { question_index: i, text });
      }

      function toggleAnswerLock(i, locked) {
        patch("/answer-lock", { question_index: i, locked });
      }

      function setPoints(i, points) {
        patch("/points", { question_index: i, points });
      }

      function togglePointsLock(i, locked) {
        patch("/points-lock", { question_index: i, locked });
      }

      function toggleDuplicate(i, flagged) {
        patch("/duplicate-flag", { question_index: i, flagged });
      }

      function fillPass(i) {
        setAnswer(i, "Pass");
        setPoints(i, 0);
      }

      // Compact scoreboard tile for Judge: a small square that just needs
      // to say "not yet / pending / this many points" — the full answer
      // text is already visible in the row form above.
      function judgeTallySlotsHtml(slots) {
        return slots
          .map((s) => {
            if (!s.points_revealed && !s.text_revealed)
              return '<span class="tally-slot">-</span>';
            if (!s.points_revealed) return '<span class="tally-slot pending">…</span>';
            return `<span class="tally-slot filled">${s.points}</span>`;
          })
          .join("");
      }

      // Rich per-question row for the Main view: two separate chip cards
      // (a wide answer chip, a narrow points chip), not one merged box —
      // the audience sees the judge's typed answer as soon as it's locked
      // (reveal beat one), then the point value once points are
      // separately locked (reveal beat two) — the two are independent.
      function mainTallySlotsHtml(slots) {
        return slots
          .map((s) => {
            const hasText = s.text !== null;
            const hasPoints = s.points !== null;
            const answerCls = hasText ? "filled" : "";
            const text = hasText ? s.text : "-";
            const points = hasPoints ? s.points : "";
            return (
              '<div class="slot-row">' +
              `<div class="slot-card answer-chip${answerCls ? " " + answerCls : ""}">${text}</div>` +
              `<div class="slot-card points-chip${hasPoints ? " filled" : ""}">${points}</div>` +
              "</div>"
            );
          })
          .join("");
      }

      function turnStatusText(s) {
        if (!s.current_player) return "Waiting to start";
        const name = s.current_player === "player1" ? s.player1_name : s.player2_name;
        return `${name}'s turn`;
      }

      function renderMain() {
        if (!state) return;

        document.getElementById("turn-main").textContent = turnStatusText(state);
        document.getElementById("timer-main").textContent =
          state.remaining_seconds !== null ? `${state.remaining_seconds}s` : "";

        document.getElementById("main-tallies").innerHTML = `
          <div class="player-column">
            <div class="tally-name">${state.player1_name}</div>
            <div class="tally-slots">${mainTallySlotsHtml(state.player1_slots)}</div>
            <div class="tally-total display-num">${state.player1_total}</div>
          </div>
          <div class="player-column">
            <div class="tally-name">${state.player2_name}</div>
            <div class="tally-slots">${mainTallySlotsHtml(state.player2_slots)}</div>
            <div class="tally-total display-num">${state.player2_total}</div>
          </div>`;

        document.getElementById("combined-total-main").textContent =
          `Combined: ${state.combined_total} / ${state.win_threshold}`;

        const verdictEl = document.getElementById("verdict");
        if (state.scores_revealed) {
          verdictEl.hidden = false;
          verdictEl.className = state.won ? "won" : "";
          verdictEl.textContent = state.won
            ? `WINNER! ${state.combined_total} points!`
            : `${state.combined_total} / ${state.win_threshold} — so close!`;
        } else {
          verdictEl.hidden = true;
        }
      }

      function renderHost() {
        if (!state) return;

        const scoredCount = (slots) => slots.filter((s) => s.points !== null).length;
        const progress = state.current_player
          ? ` — ${scoredCount(
              state.current_player === "player1" ? state.player1_slots : state.player2_slots
            )}/5 scored`
          : "";
        document.getElementById("host-turn-status").textContent =
          turnStatusText(state) + progress;
        document.getElementById("host-timer").textContent =
          state.remaining_seconds !== null ? `${state.remaining_seconds}s` : "";
        document.getElementById("host-question-list").innerHTML = state.all_questions
          .map((q) => `<li>${q.prompt}</li>`)
          .join("");
      }

      // ----- Judge: one form row per question, incrementally updated -----
      //
      // render() runs on every poll tick where *anything* differs —
      // including remaining_seconds ticking down once a second — not just
      // when the judge does something. A text `<input>` loses focus and
      // cursor position the instant it's replaced, so the 5 rows are built
      // ONCE per active player (see judgeRowsBuiltForPlayer) and every
      // subsequent render only patches values into the existing elements,
      // never rebuilding them — and never overwrites a field the judge is
      // actively typing in.

      function buildJudgeRows() {
        const container = document.getElementById("judge-rows");
        const prompts = judgeState.all_questions;
        // The buzzer ("player 2 repeated player 1's answer, contestant
        // answers again") only makes sense during player 2's turn — there's
        // nothing to duplicate against during player 1's — so it's only
        // built into the row markup then, not just hidden for player 1.
        const showBuzzer = judgeState.current_player === "player2";
        container.innerHTML = prompts
          .map((q, i) => {
            const quickPoints = answerKey
              ? answerKey[i].answers
                  .map(
                    (a) =>
                      `<button class="quick-pt-btn" onclick="setPoints(${i}, ${a.points})">${a.text} (${a.points})</button>`
                  )
                  .join("") +
                `<button class="quick-pt-btn" onclick="setPoints(${i}, 0)">No match (0)</button>`
              : "";
            const buzzer = showBuzzer
              ? `<button class="buzzer-btn" id="buzzer-btn-${i}" onclick="toggleDuplicate(${i}, !judgeState.player_slots_active[${i}].duplicate)"></button>`
              : "";
            return `
              <div class="judge-row" data-index="${i}">
                <div class="judge-row-prompt">${q.prompt}</div>
                <div class="judge-row-line">
                  <input type="text" class="answer-input" id="answer-input-${i}"
                         placeholder="Contestant's answer..." />
                  <button class="primary lock-btn" id="answer-lock-btn-${i}"></button>
                  ${buzzer}
                </div>
                <div class="judge-row-line">
                  <div class="quick-points" id="quick-points-${i}">${quickPoints}</div>
                  <button class="quick-pt-btn" onclick="fillPass(${i})">Pass</button>
                </div>
                <div class="judge-row-line">
                  <input type="number" class="points-input" id="points-input-${i}" min="0" />
                  <button class="primary lock-btn" id="points-lock-btn-${i}"></button>
                </div>
              </div>`;
          })
          .join("");

        // Wire input change handlers once, here, rather than inline
        // oninput attributes — keeps the (rebuilt-once) markup simpler.
        prompts.forEach((_, i) => {
          document.getElementById(`answer-input-${i}`).addEventListener("change", (e) => {
            setAnswer(i, e.target.value);
          });
          document.getElementById(`points-input-${i}`).addEventListener("change", (e) => {
            const v = parseInt(e.target.value, 10);
            setPoints(i, Number.isFinite(v) && v >= 0 ? v : 0);
          });
        });
      }

      function updateJudgeRows(slots) {
        // Exposed for the buzzer's inline onclick above, which needs the
        // *current* duplicate flag to toggle it.
        judgeState.player_slots_active = slots;

        slots.forEach((slot, i) => {
          const answerInput = document.getElementById(`answer-input-${i}`);
          answerInput.disabled = slot.text_revealed;
          if (document.activeElement !== answerInput) {
            answerInput.value = slot.text;
          }

          const answerLockBtn = document.getElementById(`answer-lock-btn-${i}`);
          answerLockBtn.textContent = slot.text_revealed ? "Unlock Answer" : "Lock Answer";
          answerLockBtn.onclick = () => toggleAnswerLock(i, !slot.text_revealed);

          const pointsInput = document.getElementById(`points-input-${i}`);
          pointsInput.disabled = slot.points_revealed;
          if (document.activeElement !== pointsInput) {
            pointsInput.value = slot.points;
          }

          const pointsLockBtn = document.getElementById(`points-lock-btn-${i}`);
          pointsLockBtn.textContent = slot.points_revealed
            ? "Unlock Points"
            : "Lock Points";
          pointsLockBtn.onclick = () => togglePointsLock(i, !slot.points_revealed);

          const buzzerBtn = document.getElementById(`buzzer-btn-${i}`);
          if (buzzerBtn) {
            buzzerBtn.textContent = slot.duplicate ? "Duplicate flagged" : "Flag Duplicate";
            buzzerBtn.classList.toggle("active", slot.duplicate);
          }
        });
      }

      function renderJudge() {
        if (!judgeState) return;

        document.getElementById("player1-name-label").textContent = judgeState.player1_name;
        document.getElementById("player2-name-label").textContent = judgeState.player2_name;
        document.getElementById("player1-tally").innerHTML = judgeTallySlotsHtml(
          judgeState.player1_slots
        );
        document.getElementById("player2-tally").innerHTML = judgeTallySlotsHtml(
          judgeState.player2_slots
        );
        document.getElementById("player1-total").textContent = judgeState.player1_total;
        document.getElementById("player2-total").textContent = judgeState.player2_total;

        const noRoundEl = document.getElementById("judge-no-round");
        const rowsEl = document.getElementById("judge-rows");
        if (!judgeState.current_player) {
          noRoundEl.hidden = false;
          rowsEl.hidden = true;
          judgeRowsBuiltForPlayer = undefined;
          return;
        }
        noRoundEl.hidden = true;
        rowsEl.hidden = false;

        const needsRebuild =
          judgeRowsBuiltForPlayer !== judgeState.current_player ||
          (answerKey && !judgeRowsBuiltWithAnswerKey);
        if (needsRebuild) {
          buildJudgeRows();
          judgeRowsBuiltForPlayer = judgeState.current_player;
          judgeRowsBuiltWithAnswerKey = !!answerKey;
        }
        const activeSlots =
          judgeState.current_player === "player1"
            ? judgeState.player1_slots
            : judgeState.player2_slots;
        updateJudgeRows(activeSlots);
      }

      poll();
      setInterval(poll, 200);
    </script>
  </body>
</html>
