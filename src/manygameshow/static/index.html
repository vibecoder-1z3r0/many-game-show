<!DOCTYPE html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Many Game Show</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --panel-2: #1a2540;
        --text: #f5f7fa;
        --text-dim: #9aa5b8;
        --accent: #ffcc00;
        --border: #263252;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(1rem, 4vw, 3rem);
      }

      h1 {
        color: var(--accent);
      }

      .create-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .games {
        width: min(600px, 100%);
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .game-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .game-type {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 0.2rem;
      }

      .game-card .meta {
        font-size: 0.85rem;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 0.35rem;
        flex-wrap: wrap;
      }

      .mini-strikes {
        display: inline-flex;
        gap: 0.2rem;
      }

      .mini-strike-x {
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        font-weight: 800;
        color: var(--text-dim);
        line-height: 1;
      }

      .mini-strike-x.on {
        border-color: #ff4d4d;
        color: #ff4d4d;
        background: rgba(255, 77, 77, 0.15);
      }

      .links a {
        color: var(--accent);
        text-decoration: none;
        margin-left: 0.75rem;
        font-size: 0.85rem;
      }

      button {
        background: var(--accent);
        color: #10131a;
        border: none;
        border-radius: 0.4rem;
        padding: 0.6rem 1.2rem;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.95rem;
      }

      .links button.danger {
        background: transparent;
        border: 1px solid #ff4d4d;
        color: #ff4d4d;
        margin-left: 0.75rem;
        padding: 0.35rem 0.7rem;
        font-size: 0.8rem;
      }

      .empty {
        color: var(--text-dim);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Many Game Show</h1>
    <div class="create-buttons">
      <button onclick="createSquadSquabbleGame()">New Squad Squabble Game</button>
      <button onclick="createSpeedPointsGame()">New Speed Points Game</button>
    </div>
    <div class="games" id="games"></div>
    <script>
      // Each game type has its own API prefix + control/display page. Adding
      // a game means adding one entry here plus a card-rendering function
      // below — see ADDING_A_GAME.md step 4.
      const GAME_TYPES = [
        { key: "squad-squabble", label: "Squad Squabble", render: renderSquadSquabbleCard },
        { key: "speed-points", label: "Speed Points", render: renderSpeedPointsCard },
      ];

      async function createSquadSquabbleGame() {
        const resp = await fetch("/api/squad-squabble/games/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        const game = await resp.json();
        location.href = `/squad-squabble.html?id=${game.id}&view=control`;
      }

      async function createSpeedPointsGame() {
        const resp = await fetch("/api/speed-points/games/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });
        const game = await resp.json();
        location.href = `/speed-points.html?id=${game.id}&view=host`;
      }

      function controllingLabel(g) {
        if (g.controlling_team === "team1") return g.team1_name;
        if (g.controlling_team === "team2") return g.team2_name;
        return "None";
      }

      function strikeDotsHtml(strikes) {
        let html = '<span class="mini-strikes">';
        for (let i = 0; i < 3; i++) {
          html += `<span class="mini-strike-x${i < strikes ? " on" : ""}">X</span>`;
        }
        html += "</span>";
        return html;
      }

      function renderSquadSquabbleCard(g) {
        return `
          <div class="game-card">
            <div>
              <div class="game-type">Squad Squabble</div>
              <strong>${g.team1_name} vs ${g.team2_name}</strong>
              <div class="meta">${g.team1_score} – ${g.team2_score} · ${g.status}</div>
              <div class="meta">
                <span
                  >Round ${g.current_round} · Control: ${controllingLabel(g)}</span
                >
                ${strikeDotsHtml(g.strikes)}
              </div>
            </div>
            <div class="links">
              <a href="/squad-squabble.html?id=${g.id}&view=display">Display</a>
              <a href="/squad-squabble.html?id=${g.id}&view=control">Control</a>
              <button class="danger" onclick="deleteGame('squad-squabble', '${g.id}')">Delete</button>
            </div>
          </div>`;
      }

      function turnLabel(g) {
        if (!g.current_player) return "Not started";
        const name = g.current_player === "player1" ? g.player1_name : g.player2_name;
        return `${name}'s turn — Q${Math.min(g.current_question_index + 1, 5)}/5`;
      }

      function renderSpeedPointsCard(g) {
        return `
          <div class="game-card">
            <div>
              <div class="game-type">Speed Points</div>
              <strong>${g.player1_name} & ${g.player2_name}</strong>
              <div class="meta">${g.combined_total} / ${g.win_threshold} · ${g.status}</div>
              <div class="meta">${turnLabel(g)}</div>
            </div>
            <div class="links">
              <a href="/speed-points.html?id=${g.id}&view=display">Display</a>
              <a href="/speed-points.html?id=${g.id}&view=host">Host</a>
              <a href="/speed-points.html?id=${g.id}&view=judge">Judge</a>
              <button class="danger" onclick="deleteGame('speed-points', '${g.id}')">Delete</button>
            </div>
          </div>`;
      }

      async function loadGames() {
        const lists = await Promise.all(
          GAME_TYPES.map(async (t) => {
            const resp = await fetch(`/api/${t.key}/games/`);
            const games = await resp.json();
            return games.map((g) => ({ ...g, _type: t }));
          })
        );
        const all = lists.flat().sort(
          (a, b) => new Date(b.created_at) - new Date(a.created_at)
        );

        const el = document.getElementById("games");
        if (all.length === 0) {
          el.innerHTML = '<p class="empty">No games yet — start one above.</p>';
          return;
        }
        el.innerHTML = all.map((g) => g._type.render(g)).join("");
      }

      async function deleteGame(typeKey, id) {
        if (!confirm("Delete this game? This can't be undone.")) return;
        await fetch(`/api/${typeKey}/games/${id}`, { method: "DELETE" });
        loadGames();
      }

      loadGames();
      setInterval(loadGames, 1000);
    </script>
  </body>
</html>
