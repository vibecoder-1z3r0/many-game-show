<!DOCTYPE html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Many Game Show</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --text: #f5f7fa;
        --accent: #ffcc00;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      main {
        background: var(--panel);
        padding: clamp(1rem, 4vw, 3rem);
        border-radius: 0.5rem;
        text-align: center;
      }

      h1 {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Many Game Show</h1>
      <p>Lobby placeholder — games will be listed here.</p>
    </main>
  </body>
</html>
