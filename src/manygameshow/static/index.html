<!DOCTYPE html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Many Game Show</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #131c2e;
        --panel-2: #1a2540;
        --text: #f5f7fa;
        --text-dim: #9aa5b8;
        --accent: #ffcc00;
        --border: #263252;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(1rem, 4vw, 3rem);
      }

      h1 {
        color: var(--accent);
      }

      .create-buttons {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .games {
        width: min(600px, 100%);
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .game-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }

      .game-type {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 0.2rem;
      }

      .game-card .meta {
        font-size: 0.85rem;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 0.35rem;
        flex-wrap: wrap;
      }

      .mini-strikes {
        display: inline-flex;
        gap: 0.2rem;
      }

      .mini-strike-x {
        width: 1.1rem;
        height: 1.1rem;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.65rem;
        font-weight: 800;
        color: var(--text-dim);
        line-height: 1;
      }

      .mini-strike-x.on {
        border-color: #ff4d4d;
        color: #ff4d4d;
        background: rgba(255, 77, 77, 0.15);
      }

      dialog {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        padding: 1.25rem 1.5rem;
        width: min(30rem, calc(100vw - 2rem));
      }

      button.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }

      dialog::backdrop {
        background: rgba(5, 8, 15, 0.7);
      }

      dialog h2 {
        margin: 0 0 1rem;
        color: var(--accent);
        font-size: 1.15rem;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-bottom: 0.8rem;
        font-size: 0.85rem;
        color: var(--text-dim);
      }

      .field input,
      .field select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        padding: 0.5rem 0.6rem;
        font-size: 0.95rem;
        width: 100%;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.6rem;
        margin-top: 1.1rem;
      }

      .links a {
        color: var(--accent);
        text-decoration: none;
        margin-left: 0.75rem;
        font-size: 0.85rem;
      }

      button {
        background: var(--accent);
        color: #10131a;
        border: none;
        border-radius: 0.4rem;
        padding: 0.6rem 1.2rem;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.95rem;
      }

      .links button.danger {
        background: transparent;
        border: 1px solid #ff4d4d;
        color: #ff4d4d;
        margin-left: 0.75rem;
        padding: 0.35rem 0.7rem;
        font-size: 0.8rem;
      }

      .empty {
        color: var(--text-dim);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Many Game Show</h1>
    <div class="create-buttons">
      <button onclick="openNewGameDialog('squad-squabble')">New Squad Squabble Game</button>
      <button onclick="openNewGameDialog('speed-points')">New Speed Points Game</button>
      <button onclick="openNewGameDialog('big-tokens')">New Big Tokens Game</button>
      <button onclick="openNewGameDialog('overdrive')">New Overdrive Game</button>
    </div>
    <dialog id="new-game-dialog">
      <form id="new-game-form" method="dialog">
        <h2 id="new-game-title"></h2>
        <div id="new-game-fields"></div>
        <div class="dialog-actions">
          <button type="button" class="secondary" onclick="closeNewGameDialog()">Cancel</button>
          <button type="submit" id="new-game-create">Create game</button>
        </div>
      </form>
    </dialog>
    <div class="games" id="games"></div>
    <script>
      // Each game type has its own API prefix + control/main page. Adding
      // a game means adding one entry here plus a card-rendering function
      // below — see ADDING_A_GAME.md step 4.
      const GAME_TYPES = [
        { key: "squad-squabble", label: "Squad Squabble", render: renderSquadSquabbleCard },
        { key: "speed-points", label: "Speed Points", render: renderSpeedPointsCard },
        { key: "big-tokens", label: "Big Tokens", render: renderBigTokensCard },
        { key: "overdrive", label: "Overdrive", render: renderOverdriveCard },
      ];

      // ----- New-game dialog -----
      //
      // Every "New … Game" button opens the same dialog, built from the
      // game's entry in NEW_GAME_FORMS: a list of fields (defaults shown,
      // so just clicking Create gives a standard game), the API call that
      // creates it, and the page to land on. Select options come from the
      // API when the dialog opens, since they depend on the content files.
      // A select field's `options` is an async function returning
      // [{ value, label }].

      async function getJson(url) {
        const resp = await fetch(url);
        return resp.json();
      }

      const idName = (list) => list.map((x) => ({ value: x.id, label: x.name }));
      // Content banks: name plus what's in them, e.g. "Classic (Git, HTTP, …)".
      const bankLabel = (b) => `${b.name} (${b.categories.join(", ")})`;
      const bankOptions = (list) => list.map((b) => ({ value: b.id, label: bankLabel(b) }));

      const NEW_GAME_FORMS = {
        "squad-squabble": {
          title: "New Squad Squabble Game",
          landing: "control",
          fields: [
            { name: "team1_name", label: "Team 1 name", type: "text", value: "Team 1" },
            { name: "team2_name", label: "Team 2 name", type: "text", value: "Team 2" },
            {
              name: "question_id",
              label: "Round 1 question",
              type: "select",
              options: async () => [
                { value: "", label: "None — choose later" },
                ...(await getJson("/api/squad-squabble/games/questions")).map((q) => ({
                  value: q.id,
                  label: q.prompt,
                })),
              ],
            },
          ],
        },
        "speed-points": {
          title: "New Speed Points Game",
          landing: "host",
          fields: [
            { name: "player1_name", label: "Player 1 name", type: "text", value: "Player 1" },
            { name: "player2_name", label: "Player 2 name", type: "text", value: "Player 2" },
            {
              name: "bank_id",
              label: "Question bank",
              type: "select",
              options: async () => idName(await getJson("/api/speed-points/games/banks")),
            },
            { name: "win_threshold", label: "Win threshold", type: "number", value: 200, min: 1 },
            {
              name: "player1_timer_seconds",
              label: "Player 1 timer (seconds)",
              type: "number",
              value: 20,
              min: 1,
              max: 300,
            },
            {
              name: "player2_timer_seconds",
              label: "Player 2 timer (seconds)",
              type: "number",
              value: 25,
              min: 1,
              max: 300,
            },
          ],
        },
        "big-tokens": {
          title: "New Big Tokens Game",
          landing: "control",
          fields: [
            {
              name: "board_id",
              label: "Board",
              type: "select",
              options: async () => idName(await getJson("/api/big-tokens/games/boards")),
            },
          ],
        },
        overdrive: {
          title: "New Overdrive Game",
          landing: "control",
          fields: [
            {
              name: "round1_bank_id",
              label: "Round 1 bank",
              type: "select",
              options: async () => bankOptions((await getJson("/api/overdrive/games/banks")).round1),
            },
            {
              name: "round2_bank_id",
              label: "Round 2 bank",
              type: "select",
              options: async () => bankOptions((await getJson("/api/overdrive/games/banks")).round2),
            },
            {
              name: "final_bank_id",
              label: "Final Exam bank",
              type: "select",
              options: async () => bankOptions((await getJson("/api/overdrive/games/banks")).final),
            },
          ],
        },
      };

      let newGameKey = null;

      function fieldHtml(f) {
        const id = `new-game-${f.name}`;
        const input =
          f.type === "select"
            ? `<select id="${id}" name="${f.name}"></select>`
            : `<input id="${id}" name="${f.name}" type="${f.type}" value="${f.value}"${
                f.min !== undefined ? ` min="${f.min}"` : ""
              }${f.max !== undefined ? ` max="${f.max}"` : ""} />`;
        return `<label class="field" for="${id}"><span>${f.label}</span>${input}</label>`;
      }

      async function openNewGameDialog(key) {
        newGameKey = key;
        const form = NEW_GAME_FORMS[key];
        document.getElementById("new-game-title").textContent = form.title;
        document.getElementById("new-game-fields").innerHTML = form.fields
          .map(fieldHtml)
          .join("");
        document.getElementById("new-game-dialog").showModal();
        await Promise.all(
          form.fields
            .filter((f) => f.type === "select")
            .map(async (f) => {
              const options = await f.options();
              document.getElementById(`new-game-${f.name}`).innerHTML = options
                .map((o) => `<option value="${o.value}">${o.label}</option>`)
                .join("");
            })
        );
      }

      function closeNewGameDialog() {
        document.getElementById("new-game-dialog").close();
      }

      document.getElementById("new-game-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = NEW_GAME_FORMS[newGameKey];
        const body = {};
        for (const f of form.fields) {
          const raw = document.getElementById(`new-game-${f.name}`).value;
          if (raw === "") continue; // blank = let the server use its default
          body[f.name] = f.type === "number" ? parseInt(raw, 10) : raw;
        }
        const resp = await fetch(`/api/${newGameKey}/games/`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          alert(`Couldn't create the game: ${(await resp.json()).detail}`);
          return;
        }
        const game = await resp.json();
        location.href = `/${newGameKey}.html?id=${game.id}&view=${form.landing}`;
      });

      function controllingLabel(g) {
        if (g.controlling_team === "team1") return g.team1_name;
        if (g.controlling_team === "team2") return g.team2_name;
        return "None";
      }

      function strikeDotsHtml(strikes) {
        let html = '<span class="mini-strikes">';
        for (let i = 0; i < 3; i++) {
          html += `<span class="mini-strike-x${i < strikes ? " on" : ""}">X</span>`;
        }
        html += "</span>";
        return html;
      }

      function renderSquadSquabbleCard(g) {
        return `
          <div class="game-card">
            <div>
              <div class="game-type">Squad Squabble</div>
              <strong>${g.team1_name} vs ${g.team2_name}</strong>
              <div class="meta">${g.team1_score} – ${g.team2_score} · ${g.status}</div>
              <div class="meta">
                <span
                  >Round ${g.current_round} · Control: ${controllingLabel(g)}</span
                >
                ${strikeDotsHtml(g.strikes)}
              </div>
            </div>
            <div class="links">
              <a href="/squad-squabble.html?id=${g.id}&view=main">Main</a>
              <a href="/squad-squabble.html?id=${g.id}&view=control">Control</a>
              <button class="danger" onclick="deleteGame('squad-squabble', '${g.id}')">Delete</button>
            </div>
          </div>`;
      }

      function turnLabel(g) {
        if (!g.current_player) return "Not started";
        const name = g.current_player === "player1" ? g.player1_name : g.player2_name;
        const slots = g.current_player === "player1" ? g.player1_slots : g.player2_slots;
        const scored = slots.filter((s) => s.points !== null).length;
        return `${name}'s turn — ${scored}/5 scored`;
      }

      function renderSpeedPointsCard(g) {
        return `
          <div class="game-card">
            <div>
              <div class="game-type">Speed Points</div>
              <strong>${g.player1_name} & ${g.player2_name}</strong>
              <div class="meta">${g.combined_total} / ${g.win_threshold} · ${g.status}</div>
              <div class="meta">${turnLabel(g)}</div>
            </div>
            <div class="links">
              <a href="/speed-points.html?id=${g.id}&view=main">Main</a>
              <a href="/speed-points.html?id=${g.id}&view=host">Host</a>
              <a href="/speed-points.html?id=${g.id}&view=judge">Judge</a>
              <button class="danger" onclick="deleteGame('speed-points', '${g.id}')">Delete</button>
            </div>
          </div>`;
      }

      function bigTokensTurnLabel(g) {
        if (!g.current_player) return "Not started";
        return `${g.players[g.current_player].name}'s turn`;
      }

      function renderBigTokensCard(g) {
        const totals = ["player1", "player2", "player3"]
          .map((p) => `${g.players[p].name}: ${g.players[p].token_total}`)
          .join(" · ");
        return `
          <div class="game-card">
            <div>
              <div class="game-type">Big Tokens</div>
              <strong>${g.board_name}</strong>
              <div class="meta">${totals}</div>
              <div class="meta">Round ${g.round_number} · ${bigTokensTurnLabel(g)}</div>
            </div>
            <div class="links">
              <a href="/big-tokens.html?id=${g.id}&view=main">Main</a>
              <a href="/big-tokens.html?id=${g.id}&view=control">Control</a>
              <a href="/big-tokens.html?id=${g.id}&view=player1">P1</a>
              <a href="/big-tokens.html?id=${g.id}&view=player2">P2</a>
              <a href="/big-tokens.html?id=${g.id}&view=player3">P3</a>
              <button class="danger" onclick="deleteGame('big-tokens', '${g.id}')">Delete</button>
            </div>
          </div>`;
      }

      function overdriveRoundLabel(round) {
        if (round === "round1") return "Round 1";
        if (round === "round2") return "Round 2";
        return "Final Exam";
      }

      function renderOverdriveCard(g) {
        const scores = ["player1", "player2", "player3"]
          .map((p) => `${g.players[p].name}: ${g.players[p].score}`)
          .join(" · ");
        return `
          <div class="game-card">
            <div>
              <div class="game-type">Overdrive</div>
              <strong>${overdriveRoundLabel(g.current_round)}</strong>
              <div class="meta">${scores}</div>
            </div>
            <div class="links">
              <a href="/overdrive.html?id=${g.id}&view=main">Main</a>
              <a href="/overdrive.html?id=${g.id}&view=control">Control</a>
              <a href="/overdrive.html?id=${g.id}&view=player1">P1</a>
              <a href="/overdrive.html?id=${g.id}&view=player2">P2</a>
              <a href="/overdrive.html?id=${g.id}&view=player3">P3</a>
              <button class="danger" onclick="deleteGame('overdrive', '${g.id}')">Delete</button>
            </div>
          </div>`;
      }

      async function loadGames() {
        const lists = await Promise.all(
          GAME_TYPES.map(async (t) => {
            const resp = await fetch(`/api/${t.key}/games/`);
            const games = await resp.json();
            return games.map((g) => ({ ...g, _type: t }));
          })
        );
        const all = lists.flat().sort(
          (a, b) => new Date(b.created_at) - new Date(a.created_at)
        );

        const el = document.getElementById("games");
        if (all.length === 0) {
          el.innerHTML = '<p class="empty">No games yet — start one above.</p>';
          return;
        }
        el.innerHTML = all.map((g) => g._type.render(g)).join("");
      }

      async function deleteGame(typeKey, id) {
        if (!confirm("Delete this game? This can't be undone.")) return;
        await fetch(`/api/${typeKey}/games/${id}`, { method: "DELETE" });
        loadGames();
      }

      loadGames();
      setInterval(loadGames, 1000);
    </script>
  </body>
</html>
